<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'"><title>Delo</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="task-controls.css"><link rel="stylesheet" href="app.css"></head><body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="m9 3 6 0-1 6 4 4v2h-5v6l-1-2-1 2v-6H6v-2l4-4z"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="m9 5 10 7-10 7z"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></symbol><symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4m8-4v4M4 10h16"/></symbol><symbol id="i-edit" viewBox="0 0 24 24"><path d="m15 4 5 5M4 20l5-1L20 8a2 2 0 0 0-4-4L5 15z"/></symbol><symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h7m4 0h5M4 17h5m4 0h7M13 4v6M9 14v6"/></symbol><symbol id="i-archive" viewBox="0 0 24 24"><path d="M4 8h16v12H4zM3 4h18v4H3M9 12h6"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 15A9 9 0 0 1 9 4a9 9 0 1 0 11 11Z"/></symbol>
<symbol id="i-bolt" viewBox="0 0 24 24"><path d="m14 2-9 12h6l-1 8 9-12h-6z"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
<symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
<symbol id="i-minimize" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
<symbol id="i-mark" viewBox="0 0 96 96"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M31 30V22q0-8 8-8h18q8 0 8 8v8h6q12 0 12 12v28q0 12-12 12H25q-12 0-12-12V42q0-12 12-12zm8 0v-4q0-4 4-4h10q4 0 4 4v4zm-8.18 26.18L44 69.36l21.18-21.18a4.5 4.5 0 0 0-6.36-6.36L44 56.64l-6.82-6.82a4.5 4.5 0 0 0-6.36 6.36z"/></symbol>
</defs></svg>

<main class="widget" id="widget" aria-label="Delo"><span class="quick-drag-zone quick-drag-top" data-label="moveQuick"></span><span class="quick-drag-zone quick-drag-right" data-label="moveQuick"></span><span class="quick-drag-zone quick-drag-bottom" data-label="moveQuick"></span><span class="quick-drag-zone quick-drag-left" data-label="moveQuick"></span>
<header class="widget-head" id="drag-handle"><h1><span class="lockup"><svg class="mark" aria-hidden="true"><use href="#i-mark"/></svg><b>Delo</b></span></h1><div class="head-actions"><button class="round" id="pin" data-label="pin" aria-pressed="false"><svg><use href="#i-pin"/></svg></button><button class="round" id="hide-widget" data-label="hide"><svg><use href="#i-minimize"/></svg></button><button class="round" id="settings-open" data-label="appMenu" aria-haspopup="menu" aria-expanded="false"><svg><use href="#i-more"/></svg></button></div></header>
<div class="subhead"><span id="today"></span><button class="reputation" id="reputation" data-label="reputation"><svg><use href="#i-bolt"/></svg><span id="score">0</span></button></div>
<div class="error" id="error" role="alert" hidden><span id="error-text"></span><button id="retry" data-text="retry"></button><button id="restore-backup" data-text="restoreBackup" hidden></button><button id="error-close" class="round" data-label="close"><svg><use href="#i-close"/></svg></button></div>
<div class="task-scroll" id="task-scroll"><p class="empty" id="empty" data-text="loading"></p></div>
<div id="undo-bar" class="undo-bar" hidden><span class="undo-countdown" role="timer"><svg viewBox="0 0 36 36" aria-hidden="true"><circle class="undo-track" cx="18" cy="18" r="15"/><circle id="undo-arc" cx="18" cy="18" r="15" pathLength="100"/></svg><span id="undo-seconds"></span></span><span class="undo-copy"><span id="undo-text"></span><span id="undo-hint"></span></span><button id="undo-delete" data-text="undo"></button></div>
<form class="inline-entry" id="entry"><label class="sr-only" for="task-input" data-text="newTask"></label><button class="entry-mic" id="voice-input" type="button" data-label="voice"><svg><use href="#i-mic"/></svg></button><textarea id="task-input" rows="1" maxlength="4000" data-placeholder="placeholder" autocomplete="off"></textarea><span id="voice-message" role="status" hidden></span><button class="add" type="button" id="new-with-date" data-label="date"><svg><use href="#i-calendar"/></svg></button><button class="add send" id="add-task" data-label="add" disabled><svg><use href="#i-arrow"/></svg></button><button class="add" id="voice-cancel" type="button" data-label="cancel" hidden><svg><use href="#i-close"/></svg></button></form>
<div class="status sr-only" id="status" role="status" aria-live="polite"></div>
</main>
<dialog id="editor" aria-labelledby="editor-title"><form id="editor-form" class="capture-surface"><div class="capture-head"><h2 id="editor-title"></h2><button class="round" type="button" data-close data-label="close"><svg><use href="#i-close"/></svg></button></div><label class="sr-only" for="editor-input" data-text="taskTitle"></label><textarea id="editor-input" rows="2" maxlength="4000" required data-placeholder="placeholder"></textarea><div class="date-editor"><label for="due-input" data-text="date"></label><input id="due-input" type="date" min="1900-01-01" max="9999-12-31"><label for="time-input"><span data-text="timeShort"></span><span data-text="optional"></span></label><input id="time-input" type="time"><div class="date-presets"><button type="button" data-days="0" data-text="today"></button><button type="button" data-days="1" data-text="tomorrow"></button><button type="button" id="clear-date" data-text="noDate"></button></div><p id="zone-hint"></p></div><p class="error editor-error" id="editor-error" role="alert" hidden></p><div class="capture-foot"><span class="editor-shortcuts"><span data-text="enterSaveHint"></span><span data-text="enterNewlineHint"></span></span><button class="save" id="editor-save" data-text="save"></button></div></form></dialog>
<div id="app-menu" popover="manual" role="menu" data-label="actions"><button role="menuitem" type="button" id="open-archive"><svg aria-hidden="true"><use href="#i-archive"/></svg><span data-text="archive"></span></button><button role="menuitem" type="button" id="open-trash"><svg aria-hidden="true"><use href="#i-trash"/></svg><span data-text="trash"></span></button><button role="menuitem" type="button" id="open-settings"><svg aria-hidden="true"><use href="#i-settings"/></svg><span data-text="settings"></span></button></div><div id="task-menu" popover="manual" role="menu" data-label="actions"><button role="menuitem" data-action="edit"><svg aria-hidden="true"><use href="#i-edit"/></svg><span data-text="edit"></span></button><button role="menuitem" data-action="date"><svg aria-hidden="true"><use href="#i-calendar"/></svg><span data-text="date"></span></button><button role="menuitem" data-action="work"><svg aria-hidden="true"><use href="#i-play"/></svg><span data-text="work"></span></button><button role="menuitem" data-action="archive"><svg aria-hidden="true"><use href="#i-archive"/></svg><span data-text="archiveTask"></span></button></div>
<dialog id="settings" aria-labelledby="settings-title"><form class="trash-surface" id="settings-form"><div class="capture-head"><h2 id="settings-title" data-text="settings"></h2><button type="button" class="round" data-close data-label="close"><svg><use href="#i-close"/></svg></button></div><div class="settings-fields">
<label><span data-text="language"></span><span class="select-shell"><select name="language"><option value="ru">Русский</option><option value="uk">Українська</option><option value="en">English</option></select><svg class="select-chevron" aria-hidden="true"><use href="#i-chevron"/></svg></span></label>
<label><span data-text="theme"></span><span class="select-shell"><select name="theme"><option value="system" data-text="system"></option><option value="light" data-text="light"></option><option value="dark" data-text="dark"></option></select><svg class="select-chevron" aria-hidden="true"><use href="#i-chevron"/></svg></span></label>
<div class="settings-check-grid"><label class="check"><input type="checkbox" name="completionSound"><span data-text="completionSound"></span></label><label class="check"><input type="checkbox" name="overdueSound"><span data-text="overdueSound"></span></label><label class="check"><input type="checkbox" name="reducedMotion"><span data-text="reducedMotion"></span></label><label class="check"><input type="checkbox" name="autostart"><span data-text="autostart"></span></label></div>
<label><span data-text="autoArchive"></span><span class="select-shell"><select name="autoArchive"><option value="all" data-text="all"></option><option value="dated" data-text="dated"></option><option value="undated" data-text="undated"></option><option value="off" data-text="off"></option></select><svg class="select-chevron" aria-hidden="true"><use href="#i-chevron"/></svg></span></label><label><span data-text="archiveDays"></span><span class="select-shell"><select name="archiveDays"><option value="1">1</option><option value="7">7</option><option value="30">30</option><option value="90">90</option></select><svg class="select-chevron" aria-hidden="true"><use href="#i-chevron"/></svg></span></label>
<label><span data-text="listShortcut"></span><input name="listShortcut" class="shortcut-recorder" readonly required aria-describedby="shortcut-hint"></label><label><span data-text="quickShortcut"></span><input name="quickShortcut" class="shortcut-recorder" readonly required aria-describedby="shortcut-hint"></label><p class="shortcut-hint" id="shortcut-hint" data-text="shortcutHint"></p>
</div><p class="error" id="settings-error" role="alert" hidden></p><div class="capture-foot"><button class="save" data-text="closeSheet"></button></div></form></dialog>
<dialog id="collection" aria-labelledby="collection-title"><div class="trash-surface"><div class="capture-head"><h2 id="collection-title"></h2><button class="round" data-close data-label="close"><svg><use href="#i-close"/></svg></button></div><p class="trash-note" id="collection-note"></p><div id="collection-list"></div><div class="collection-foot" id="collection-foot" hidden><button type="button" id="clear-trash" data-text="clearTrash"></button></div></div></dialog>
<dialog id="history" aria-labelledby="history-title"><div class="trash-surface"><div class="capture-head"><h2 id="history-title" data-text="reputation"></h2><button class="round" data-close data-label="close"><svg><use href="#i-close"/></svg></button></div><dl class="reputation-rules"><div><dt data-text="repOnTime"></dt><dd class="gain">+5</dd></div><div><dt data-text="repLate"></dt><dd class="gain">+2</dd></div><div><dt data-text="repOverdue"></dt><dd class="loss">&minus;2</dd></div><div><dt data-text="repOverdueWeek"></dt><dd class="loss">&minus;1</dd></div><div><dt data-text="repUndo"></dt><dd class="neutral" data-text="repUndoValue"></dd></div></dl><div id="history-list"></div></div></dialog>
<dialog id="confirmation" aria-labelledby="confirmation-title"><div class="trash-surface confirm-surface"><div class="capture-head"><h2 id="confirmation-title" data-text="confirmAction"></h2><button class="round" type="button" id="confirmation-close" data-label="close"><svg><use href="#i-close"/></svg></button></div><p id="confirmation-message"></p><div class="confirm-actions"><button type="button" id="confirmation-cancel" data-text="cancel"></button><button type="button" id="confirmation-accept"></button></div></div></dialog>
<script type="module" src="app.mjs"></script></body></html>
